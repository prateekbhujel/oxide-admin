[package]
name = "terminus-framework"
version = "0.1.0"
edition = "2021"
authors = ["Pratik <prateekbhujelpb@gmail.com>"]
description = "Terminus — The universal fullstack application framework for Rust and Axum powering web, mobile APIs, desktop, and IoT."
license = "MIT"
readme = "README.md"
repository = "https://github.com/prateekbhujel/terminus"
homepage = "https://github.com/prateekbhujel/terminus"
documentation = "https://docs.rs/terminus-framework"
keywords = ["framework", "fullstack", "web", "mobile", "axum"]
categories = ["web-programming::http-server", "command-line-utilities", "database", "gui", "development-tools"]

[lib]
name = "terminus"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["clock"] }

[[bin]]
name = "terminus"
path = "src/bin/terminus.rs"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[example]]
name = "universal_wms"
path = "examples/universal_wms.rs"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
